<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SIPAT 2026 | BAPLAN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --verde:#006B45;
    --verde-escuro:#004F35;
    --verde-claro:#8CC63F;
    --branco:#FFFFFF;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins', sans-serif;
    background:#FFFFFF;
    color:#333333;
    overflow-x:hidden;
}


/* =====================================================
   TELA DE ABERTURA
===================================================== */

.abertura{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;

    background:#FFFFFF;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;

    cursor:pointer;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.abertura.ocultar{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* =====================================================
   CARD VERDE DA ABERTURA
===================================================== */

.cartao{
    position:relative;

    width:90%;
    max-width:650px;
    min-height:500px;

    background:
        linear-gradient(
            145deg,
            #006B45 0%,
            #00583C 50%,
            #004F35 100%
        );

    border-radius:34px;

    padding:55px 45px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    overflow:hidden;

    box-shadow:
        0 25px 60px rgba(0,107,69,.25);
}


/* =====================================================
   ELEMENTOS DECORATIVOS
===================================================== */

.cartao::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    border:2px solid rgba(255,255,255,.12);

    border-radius:50%;

    top:-130px;
    right:-100px;
}

.cartao::after{
    content:"";

    position:absolute;

    width:240px;
    height:240px;

    border:2px solid rgba(255,255,255,.10);

    border-radius:50%;

    bottom:-100px;
    left:-90px;
}


/* =====================================================
   LOGO
===================================================== */

.logo-box{
    position:relative;
    z-index:2;

    background:#FFFFFF;

    padding:18px 28px;

    border-radius:18px;

    margin-bottom:30px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.10);
}

.logo-box img{
    width:210px;
    max-width:100%;
    height:auto;

    display:block;
}


/* =====================================================
   MARCA
===================================================== */

.marca{
    position:relative;
    z-index:2;

    color:#FFFFFF;

    font-size:14px;
    font-weight:600;

    letter-spacing:3px;

    margin-bottom:18px;
}


/* =====================================================
   TÍTULO
===================================================== */

.cartao h1{
    position:relative;
    z-index:2;

    color:#FFFFFF;

    font-size:34px;
    line-height:1.2;

    font-weight:800;

    max-width:520px;

    margin-bottom:22px;
}


/* =====================================================
   TEXTO
===================================================== */

.cartao p{
    position:relative;
    z-index:2;

    color:rgba(255,255,255,.85);

    font-size:15px;
    font-weight:400;

    margin-bottom:30px;
}


/* =====================================================
   BOTÃO ABRIR
===================================================== */

.botao-abrir{
    position:relative;
    z-index:2;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:15px 32px;

    background:#FFFFFF;

    color:var(--verde);

    border-radius:50px;

    font-size:14px;

    font-weight:700;

    letter-spacing:.5px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.cartao:hover .botao-abrir{
    transform:translateY(-3px);

    box-shadow:
        0 14px 30px rgba(0,0,0,.20);
}


/* =====================================================
   CONTEÚDO PRINCIPAL
===================================================== */

.container{
    width:100%;

    min-height:100vh;

    display:none;

    background:#FFFFFF;

    animation:aparecer .8s ease;
}

.container.mostrar{
    display:block;
}


@keyframes aparecer{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   ÁREA DO CONVITE
===================================================== */

.convite{
    width:100%;

    max-width:1200px;

    margin:0 auto;

    background:#FFFFFF;

    padding:30px 15px 15px;
}


/* =====================================================
   MOLDURA DA IMAGEM
===================================================== */

.imagem-container{

    width:100%;

    max-width:1150px;

    margin:30px auto 40px;

    padding:8px;

    background:#006B45;

    border:2px solid #006B45;

    border-radius:26px;

    overflow:hidden;

    box-shadow:
        0 12px 35px
        rgba(0,107,69,.20);
}


/* =====================================================
   PICTURE
   DESKTOP = sipat.jpeg
   CELULAR = sipat2.jpeg
===================================================== */

.imagem-container picture{
    display:block;

    width:100%;
}

.imagem-container picture img{

    width:100%;

    max-width:100%;

    height:auto;

    display:block;

    margin:0 auto;

    border-radius:18px;

}


/* =====================================================
   BOTÕES
===================================================== */

.acoes{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

    margin:0 auto 35px;
}


.botao{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:230px;

    padding:15px 25px;

    border-radius:50px;

    text-decoration:none;

    font-size:14px;

    font-weight:700;

    letter-spacing:.3px;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
}


/* =====================================================
   CONFIRMAR PRESENÇA
===================================================== */

.botao-confirmar{

    background:var(--verde);

    color:#FFFFFF;

    box-shadow:
        0 8px 20px rgba(0,107,69,.20);
}

.botao-confirmar:hover{

    background:var(--verde-escuro);

    transform:translateY(-3px);

    box-shadow:
        0 12px 25px rgba(0,107,69,.28);
}


/* =====================================================
   LOCALIZAÇÃO
===================================================== */

.botao-localizacao{

    background:#FFFFFF;

    color:var(--verde);

    border:2px solid var(--verde);
}

.botao-localizacao:hover{

    background:var(--verde);

    color:#FFFFFF;

    transform:translateY(-3px);
}


/* =====================================================
   RODAPÉ
===================================================== */

footer{

    width:100%;

    text-align:center;

    padding:25px 20px 30px;

    color:#777777;

    font-size:11px;

    font-weight:500;

    letter-spacing:1px;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:900px){

    .convite{

        max-width:100%;

        padding:
            20px 12px
            10px;
    }

    .imagem-container{

        max-width:100%;

        margin:
            20px auto
            30px;

        padding:6px;

        border-radius:22px;
    }

    .imagem-container picture img{

        border-radius:16px;
    }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .cartao{

        width:92%;

        min-height:450px;

        padding:
            40px 25px;

        border-radius:28px;
    }


    /* LOGO */

    .logo-box{

        padding:
            14px 20px;

        margin-bottom:25px;
    }

    .logo-box img{

        width:170px;
    }


    /* MARCA */

    .marca{

        font-size:11px;

        letter-spacing:2px;
    }


    /* TÍTULO */

    .cartao h1{

        font-size:25px;

        max-width:100%;
    }


    /* TEXTO */

    .cartao p{

        font-size:13px;

        margin-bottom:25px;
    }


    /* BOTÃO ABRIR */

    .botao-abrir{

        padding:
            13px 25px;

        font-size:12px;
    }


    /* =================================================
       CONVITE MOBILE
    ================================================= */

    .convite{

        padding:
            15px 8px
            5px;
    }


    .imagem-container{

        width:100%;

        margin:
            15px auto
            25px;

        padding:5px;

        border-radius:18px;
    }


    .imagem-container picture img{

        width:100%;

        border-radius:13px;
    }


    /* =================================================
       BOTÕES MOBILE
    ================================================= */

    .acoes{

        flex-direction:column;

        gap:10px;

        padding:
            0 10px;
    }


    .botao{

        width:100%;

        min-width:0;

        padding:
            14px 20px;
    }


    /* RODAPÉ */

    footer{

        padding:
            20px 15px
            25px;

        font-size:9px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     TELA DE ABERTURA
===================================================== -->

<div
    class="abertura"
    id="abertura"
>

    <div class="cartao">


        <div class="logo-box">

            <img
                src="logo.png"
                alt="BAPLAN - Base de Paulínia"
            >

        </div>


        <div class="marca">

            • VIBRA ENERGIA

        </div>


        <h1>

            A BAPLAN TEM UM
            CONVITE ESPECIAL
            PARA VOCÊ

        </h1>


        <p>

            Prepare-se para participar da
            SIPAT 2026!

        </p>


        <div class="botao-abrir">

            CLIQUE PARA ABRIR

        </div>


    </div>

</div>



<!-- =====================================================
     CONTEÚDO PRINCIPAL
===================================================== -->

<main
    class="container"
    id="conteudo"
>


    <section class="convite">


        <!-- =================================================
             IMAGEM DO CONVITE

             COMPUTADOR:
             sipat.jpeg

             CELULAR:
             sipat2.jpeg
        ================================================== -->

        <div class="imagem-container">

            <picture>

                <!--
                    Até 600px:
                    carrega a versão vertical
                -->

                <source
                    media="(max-width: 600px)"
                    srcset="sipat2.jpeg"
                >


                <!--
                    Notebook/Desktop:
                    carrega a versão normal
                -->

                <img
                    src="sipat.jpeg"
                    alt="Convite SIPAT 2026 - BAPLAN"
                >

            </picture>

        </div>



        <!-- =================================================
             BOTÕES
        ================================================== -->

        <div class="acoes">


            <!-- =================================================
                 CONFIRMAR PRESENÇA
            ================================================== -->

            <a
                href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=ppSfgHcEkEO4buqxTFSTp5YfKd-sYj5EqZVxfFmNMbZUNFUyMVZMNElYTTQwTEM3MTFGNE4yU1pYTC4u"
                target="_blank"
                rel="noopener noreferrer"
                class="botao botao-confirmar"
            >

                ✓ CONFIRMAR PRESENÇA

            </a>



            <!-- =================================================
                 LOCALIZAÇÃO
            ================================================== -->

            <a
                href="https://www.google.com/maps/search/?api=1&query=VIBRA+ENERGIA+BAPLAN"
                target="_blank"
                rel="noopener noreferrer"
                class="botao botao-localizacao"
            >

                📍 VER LOCALIZAÇÃO

            </a>


        </div>


    </section>



    <!-- =====================================================
         RODAPÉ
    ====================================================== -->

    <footer>

        VIBRA ENERGIA
        •
        BASE DE PAULÍNIA
        •
        BAPLAN
        •
        SIPAT 2026

    </footer>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

const abertura =
    document.getElementById("abertura");

const conteudo =
    document.getElementById("conteudo");


abertura.addEventListener(
    "click",
    function(){

        abertura.classList.add("ocultar");

        setTimeout(
            function(){

                conteudo.classList.add("mostrar");

            },
            400
        );

    }
);

</script>


</body>

</html>
